<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>그날의 장면들 — 사진·영상 보내기</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=bespoke-serif@400,500,401,501&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500&family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F1E6; --paper-deep:#ECE5D4; --card:#FBF8F1; --ink:#2B2622; --ink-soft:#6F675E;
  --red:#C2463C; --line:#D9D1C0; --ok:#4E7A5A;
  --disp:"Bespoke Serif","Noto Serif KR",Georgia,serif;
  --cond:"Oswald","Apple SD Gothic Neo",sans-serif;
  --kr:"Noto Serif KR","Apple Myungjo",serif;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --hand:"Christmas Twinkle","Ms Madi",cursive;
}
@font-face{font-family:"Christmas Twinkle"; src:url("fonts/ChristmasTwinklePersonaluse-Regular.ttf") format("truetype"); font-display:swap}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:#DED7C6; font-family:var(--kr); color:var(--ink); line-height:1.8}
.sheet{max-width:430px; margin:0 auto; background:var(--paper); min-height:100vh; padding:56px 26px 80px; box-shadow:0 0 70px rgba(43,38,34,.2)}
.top{display:flex; justify-content:space-between; font-family:var(--cond); font-size:10.5px; letter-spacing:.32em; color:var(--ink-soft); text-transform:uppercase; margin-bottom:34px}
h1{font-family:var(--disp); font-size:34px; font-weight:400; line-height:1.1; text-align:center}
h1 i{font-style:italic; color:var(--red); font-size:.6em; display:inline-block; margin:0 6px}
.kr{font-size:13px; letter-spacing:.28em; text-indent:.28em; color:var(--ink-soft); text-align:center; margin-top:8px}
.lead{margin:34px 0 26px; text-align:center}
.lead .hand{font-family:var(--hand); font-size:40px; color:var(--red); line-height:1; margin-bottom:26px}
.lead p{font-size:14.5px; line-height:2; text-wrap:balance}
.lead p small{display:block; font-family:var(--sans); font-weight:300; font-size:12.5px; color:var(--ink-soft); margin-top:8px}

.f{margin-bottom:14px}
.l{display:block; font-family:var(--sans); font-weight:500; font-size:12.5px; letter-spacing:.04em; margin-bottom:7px}
.l em{font-style:normal; font-weight:300; color:#A69E92; margin-left:6px; font-size:11.5px}
input[type=text]{width:100%; background:var(--card); border:1.5px solid var(--line); border-radius:8px; padding:12px 14px; font-family:var(--sans); font-size:15px; color:var(--ink); outline:0}
input[type=text]:focus{border-color:var(--ink)}

.drop{
  display:block; border:1.5px dashed var(--ink); border-radius:12px; background:var(--card); padding:30px 18px; text-align:center; cursor:pointer;
  transition:background .15s;
}
.drop:active,.drop.over{background:var(--paper-deep)}
.drop .ic{display:block; font-family:var(--disp); font-size:34px; line-height:1; color:var(--red)}
.drop b{display:block; font-family:var(--sans); font-weight:500; font-size:14.5px; margin-top:10px}
.drop small{display:block; font-family:var(--sans); font-weight:300; font-size:11.5px; color:var(--ink-soft); margin-top:4px}
.drop input{display:none}

.list{margin-top:16px; display:grid; gap:8px}
.item{display:grid; grid-template-columns:44px 1fr auto; gap:12px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 10px}
.item .th{width:44px; height:44px; border-radius:4px; background:var(--paper-deep); overflow:hidden; display:grid; place-items:center; font-family:var(--cond); font-size:10px; color:var(--ink-soft)}
.item .th img,.item .th video{width:100%; height:100%; object-fit:cover; display:block}
.item .nm{font-family:var(--sans); font-size:12.5px; font-weight:400; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.item .sz{font-family:var(--cond); font-size:10.5px; letter-spacing:.08em; color:var(--ink-soft)}
.item .bar{height:3px; background:var(--paper-deep); border-radius:2px; margin-top:6px; overflow:hidden}
.item .bar i{display:block; height:100%; width:0; background:var(--red); transition:width .25s}
.item .st{font-family:var(--cond); font-size:11px; letter-spacing:.14em; color:var(--ink-soft); min-width:44px; text-align:right}
.item.done .st{color:var(--ok)} .item.done .bar i{background:var(--ok)}
.item.err .st{color:var(--red)}
.item .rm{border:0; background:none; color:var(--ink-soft); font-size:18px; cursor:pointer; padding:4px 6px; line-height:1}

.sum{margin-top:14px; font-family:var(--cond); font-size:11px; letter-spacing:.2em; color:var(--ink-soft); text-align:center}
.go{width:100%; margin-top:16px; padding:16px; border:0; border-radius:999px; background:var(--red); color:#FBF8F1; font-family:var(--sans); font-size:15px; font-weight:500; cursor:pointer; letter-spacing:.02em}
.go:disabled{background:#C9BFAE; cursor:default}
.note{margin-top:14px; font-family:var(--sans); font-weight:300; font-size:12px; color:var(--ink-soft); text-align:center; line-height:1.8}
.msg{margin-top:12px; font-family:var(--sans); font-size:13px; color:var(--red); text-align:center; min-height:20px}

.thanks{display:none; text-align:center; padding:26px 0 10px}
.thanks p{font-size:14.5px; line-height:2}
.thanks button{margin-top:22px; padding:12px 22px; border:1.5px solid var(--ink); background:none; border-radius:999px; font-family:var(--sans); font-size:13px; cursor:pointer; color:var(--ink)}
.sheet.finished form{display:none} .sheet.finished .thanks{display:block}

.kakao{display:none; margin:0 0 16px; padding:14px 16px; border:1.5px solid var(--red); border-radius:10px; background:#FCF3F1; font-family:var(--sans); font-size:13px; line-height:1.7; text-align:center}
.kakao b{font-weight:500}
.kakao a{display:inline-block; margin-top:8px; padding:10px 18px; background:var(--red); color:#FBF8F1; text-decoration:none; border-radius:999px; font-weight:500; font-size:13px}
body.in-kakao .kakao{display:block}
footer{margin-top:60px; text-align:center; font-family:var(--cond); font-size:10.5px; letter-spacing:.3em; color:var(--ink-soft)}
</style>
</head>
<body>
<div class="sheet" id="sheet">
  <p class="top"><span>Wedding day</span><span>27 · 02 · 2027</span></p>
  <h1>Hanyong<i>&amp;</i>Sejeong</h1>
  <p class="kr">조한용 · 한세정</p>

  <div class="lead">
    <p class="hand">Thank you</p>
    <p>오늘 담아주신 사진과 영상을<br>저희에게 나눠주세요.</p>
  </div>

  <div class="kakao">
    카카오톡 안에서는 갤러리 선택이 안 될 수 있어요.<br><b>기본 브라우저로 열면</b> 갤러리에서 바로 고를 수 있습니다.
    <br><a id="ext" href="#">브라우저로 열기</a>
  </div>
  <form id="form" novalidate>
    <div class="f">
      <label class="l" for="guest">보내는 분 <em>선택 · 파일 이름 앞에 붙습니다</em></label>
      <input type="text" id="guest" autocomplete="name" placeholder="성함 또는 별명">
    </div>
    <div class="f">
      <label class="drop" id="drop">
        <span class="ic">+</span>
        <b>사진 · 영상 선택</b>
        <small>여러 개를 한 번에 고를 수 있어요</small>
        <input type="file" class="files" multiple accept="image/*,video/*">
      </label>
    </div>
    <div class="list" id="list"></div>
    <p class="sum" id="sum"></p>
    <button type="submit" class="go" id="go" disabled>보내기</button>
    <p class="msg" id="msg"></p>
    <p class="note">영상은 크기에 따라 몇 분 걸릴 수 있어요.<br>전송 중에는 이 화면을 닫지 말아 주세요.</p>
  </form>

  <div class="thanks" id="thanks">
    <p>소중한 장면들이 잘 전달되었습니다.<br>함께해 주셔서 감사합니다.</p>
    <button type="button" id="more">더 보내기</button>
  </div>

  <footer>2027 . 02 . 27 · THE VERDE G</footer>
</div>

<script>
// ── 설정: Apps Script 웹앱 배포 URL 과 키 (Code.gs 의 KEY 와 동일) ──
const CONFIG = {
  SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbycAU2X3RP1imRu1audZI_Cn2r6yidfqGstQdEOmkGEr_f-HWyYWP5rfCPPG4PkRgFOXA/exec',
  KEY: 'hy-sj-0227',
  CHUNK: 32 * 1024 * 1024,                      // 직접 전송 청크 32MB (256KB 의 배수)
  PROXY_CHUNK: 8 * 1024 * 1024,                 // Apps Script 경유 시 8MB
  PARALLEL: 3                                   // 동시에 올리는 파일 수
};
// QR 링크에 ?k=키 를 붙이면 그 값을 우선 사용 (코드에 키를 안 남기고 싶을 때)
const KEY = new URLSearchParams(location.search).get('k') || CONFIG.KEY;

const $ = id => document.getElementById(id);
// 카카오톡 인앱 브라우저: 파일 선택창에 갤러리가 없음 → 외부 브라우저로 여는 안내
if (/KAKAOTALK/i.test(navigator.userAgent)) {
  document.body.classList.add('in-kakao');
  $('ext').href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href);
}
const list = $('list'), sum = $('sum'), go = $('go'), msg = $('msg'), inputs = document.querySelectorAll('.files'), drop = $('drop');
let queue = [];   // {file, el, bar, st, status}

const fmt = b => b >= 1e9 ? (b / 1e9).toFixed(2) + ' GB' : b >= 1e6 ? (b / 1e6).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1e3)) + ' KB';

function addFiles(files) {
  for (const file of files) {
    if (queue.some(q => q.file.name === file.name && q.file.size === file.size)) continue;
    const el = document.createElement('div'); el.className = 'item';
    const th = document.createElement('div'); th.className = 'th';
    if (file.type.startsWith('image/')) { const im = new Image(); im.src = URL.createObjectURL(file); im.onload = () => URL.revokeObjectURL(im.src); th.appendChild(im); }
    else if (file.type.startsWith('video/')) { th.textContent = 'VIDEO'; }
    else th.textContent = 'FILE';
    const mid = document.createElement('div');
    mid.innerHTML = `<div class="nm"></div><div class="sz">${fmt(file.size)}</div><div class="bar"><i></i></div>`;
    mid.querySelector('.nm').textContent = file.name;
    const right = document.createElement('div'); right.style.display = 'grid'; right.style.justifyItems = 'end';
    const st = document.createElement('span'); st.className = 'st'; st.textContent = '대기';
    const rm = document.createElement('button'); rm.type = 'button'; rm.className = 'rm'; rm.textContent = '×'; rm.setAttribute('aria-label', '목록에서 빼기');
    right.append(st, rm);
    el.append(th, mid, right); list.appendChild(el);
    const q = { file, el, bar: mid.querySelector('.bar i'), st, status: 'wait' };
    rm.addEventListener('click', () => { if (q.status === 'up') return; queue = queue.filter(x => x !== q); el.remove(); refresh(); });
    queue.push(q);
  }
  refresh();
}
function refresh() {
  const pending = queue.filter(q => q.status !== 'done');
  const total = pending.reduce((a, q) => a + q.file.size, 0);
  sum.textContent = pending.length ? `${pending.length} FILES · ${fmt(total)}` : '';
  go.disabled = !pending.length; msg.textContent = '';
}
inputs.forEach(input => input.addEventListener('change', () => { addFiles(input.files); input.value = ''; }));
['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => addFiles(e.dataTransfer.files));

// ── Apps Script 호출: text/plain 으로 보내야 preflight 없이 CORS 통과 ──
async function api(body) {
  const r = await fetch(CONFIG.SCRIPT_URL, { method: 'POST', body: JSON.stringify(body) });
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j;
}
const toB64 = blob => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result.split(',')[1]); fr.onerror = rej; fr.readAsDataURL(blob); });

// ── 업로드: 세션을 한 번에 개설 → 파일 3개씩 병렬 → 청크 전송 (직접 PUT, 실패 시 Apps Script 경유) ──
let mode = 'direct';
function putDirect(url, blob, start, end, total, onProg) {   // XHR: 진행률 이벤트를 받기 위해
  return new Promise((res, rej) => {
    const x = new XMLHttpRequest(); x.open('PUT', url);
    x.setRequestHeader('Content-Range', `bytes ${start}-${end}/${total}`);
    x.upload.onprogress = e => { if (e.lengthComputable) onProg(start + e.loaded); };
    x.onload = () => (x.status === 308 || (x.status >= 200 && x.status < 300)) ? res() : rej(new Error('status ' + x.status));
    x.onerror = () => rej(new Error('network')); x.send(blob);
  });
}
async function uploadOne(q, url) {
  const f = q.file;
  const prog = sent => { const p = Math.min(100, Math.round(sent / f.size * 100)); q.bar.style.width = p + '%'; q.st.textContent = p + '%'; };
  for (let start = 0; start < f.size;) {
    const CH = mode === 'direct' ? CONFIG.CHUNK : CONFIG.PROXY_CHUNK;
    const end = Math.min(start + CH, f.size) - 1, blob = f.slice(start, end + 1);
    let ok = false;
    if (mode === 'direct') {
      try { await putDirect(url, blob, start, end, f.size, prog); ok = true; }
      catch (e) { mode = 'proxy'; continue; }          // 청크 크기를 바꿔 같은 위치부터 경유 모드로 재시도
    }
    if (!ok) {
      const r = await api({ action: 'chunk', key: KEY, uploadUrl: url, start, end, total: f.size, data: await toB64(blob) });
      if (!(r.code === 308 || r.done)) throw new Error('chunk ' + r.code);
    }
    prog(end + 1); start = end + 1;
  }
}
async function openSessions(items, guest) {   // 여러 파일의 업로드 URL 을 한 번의 호출로
  try {
    const r = await api({ action: 'init-batch', key: KEY, guest, origin: location.origin,
                          files: items.map(q => ({ name: q.file.name, mime: q.file.type, size: q.file.size })) });
    if (r.items && r.items.length === items.length) return r.items.map(i => i.uploadUrl || null);
  } catch (e) { /* 구버전 서버면 아래에서 하나씩 */ }
  const out = [];
  for (const q of items) { try { out.push((await api({ action: 'init', key: KEY, name: q.file.name, mime: q.file.type, size: q.file.size, guest, origin: location.origin })).uploadUrl); } catch (e) { out.push(null); } }
  return out;
}

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  if (CONFIG.SCRIPT_URL.startsWith('PASTE')) return msg.textContent = '아직 서버가 연결되지 않았습니다.';
  const guest = $('guest').value.trim();
  go.disabled = true; go.textContent = '보내는 중…'; msg.textContent = '';
  let fail = 0;
  const items = queue.filter(q => q.status !== 'done');
  items.forEach(q => { q.status = 'up'; q.el.classList.remove('err'); q.st.textContent = '준비'; });
  const urls = await openSessions(items, guest);
  let i = 0;
  async function worker() {
    while (i < items.length) {
      const k = i++, q = items[k], url = urls[k];
      try { if (!url) throw new Error('no session'); await uploadOne(q, url); q.status = 'done'; q.el.classList.add('done'); q.st.textContent = '완료'; }
      catch (err) { q.status = 'err'; q.el.classList.add('err'); q.st.textContent = '실패'; fail++; console.error(err); }
    }
  }
  await Promise.all(Array.from({ length: Math.min(CONFIG.PARALLEL, items.length) }, worker));
  go.textContent = '보내기';
  if (fail) { msg.textContent = `${fail}개가 전송되지 않았습니다. 다시 '보내기'를 눌러 주세요.`; go.disabled = false; }
  else { $('sheet').classList.add('finished'); window.scrollTo(0, 0); }
});
$('more').addEventListener('click', () => { $('sheet').classList.remove('finished'); queue = []; list.innerHTML = ''; refresh(); });
window.addEventListener('beforeunload', e => { if (queue.some(q => q.status === 'up')) { e.preventDefault(); e.returnValue = ''; } });
</script>
</body>
</html>
